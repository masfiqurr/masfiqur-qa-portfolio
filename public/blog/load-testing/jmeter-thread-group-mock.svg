<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized JMeter Thread Group mock</title>
  <desc id="desc">Illustrative mock of an Apache JMeter test plan tree showing a Thread Group with HTTP samplers for login, enroll, and checkout on a staging host.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg2)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" fill="none" stroke="#2A2A2A"/>

  <circle cx="34" cy="34" r="6" fill="#F87171"/>
  <circle cx="56" cy="34" r="6" fill="#FBBF24"/>
  <circle cx="78" cy="34" r="6" fill="#75C32C"/>
  <rect x="1096" y="24" width="80" height="24" rx="12" fill="#1E1633" stroke="#5B29DA"/>
  <text x="1136" y="40" text-anchor="middle" fill="#B39CFF" font-size="11" font-weight="700">SAMPLE</text>

  <text x="40" y="76" fill="#FFFFFF" font-size="21" font-weight="700">Apache JMeter - Test Plan (Thread Group)</text>
  <text x="40" y="100" fill="#A3A3A3" font-size="13">GUI mock - staging checkout flow - anonymized .jmx structure</text>

  <!-- Left tree -->
  <rect x="40" y="120" width="340" height="480" rx="12" fill="#141414" stroke="#2A2A2A"/>
  <text x="56" y="148" fill="#71717A" font-size="11" font-weight="700">TEST PLAN TREE</text>

  <text x="56" y="178" fill="#FFFFFF" font-size="12">Test Plan</text>
  <text x="72" y="204" fill="#75C32C" font-size="12" font-weight="700">Thread Group: 200 Users Staging</text>
  <text x="96" y="228" fill="#A3A3A3" font-size="11">HTTP Cookie Manager</text>
  <text x="96" y="250" fill="#A3A3A3" font-size="11">CSV Data Set (test accounts)</text>
  <text x="96" y="272" fill="#B39CFF" font-size="11">HTTP Request - GET /api/health</text>
  <text x="96" y="294" fill="#B39CFF" font-size="11">HTTP Request - POST /api/auth/login</text>
  <text x="96" y="316" fill="#B39CFF" font-size="11">HTTP Request - POST /api/courses/enroll</text>
  <text x="96" y="338" fill="#B39CFF" font-size="11">HTTP Request - POST /api/checkout/confirm</text>
  <text x="96" y="360" fill="#A3A3A3" font-size="11">Constant Timer (1-3 sec think time)</text>
  <text x="72" y="392" fill="#FFFFFF" font-size="12">Summary Report (listener)</text>
  <text x="72" y="416" fill="#FFFFFF" font-size="12">View Results Tree (listener)</text>

  <!-- Right panel - Thread Group settings -->
  <rect x="400" y="120" width="760" height="480" rx="12" fill="#141414" stroke="#2A2A2A"/>
  <text x="416" y="148" fill="#FFFFFF" font-size="14" font-weight="700">Thread Group: 200 Users Staging</text>
  <text x="416" y="172" fill="#71717A" font-size="11">This is where you set how many fake users run and how fast they start.</text>

  <rect x="416" y="190" width="728" height="180" rx="10" fill="#0F0F0F" stroke="#5B29DA"/>
  <text x="432" y="216" fill="#B39CFF" font-size="12" font-weight="700">Thread Group settings</text>
  <text x="432" y="244" fill="#A3A3A3" font-size="12">Number of Threads (users):</text>
  <text x="620" y="244" fill="#FFFFFF" font-size="12" font-weight="700">200</text>
  <text x="432" y="270" fill="#A3A3A3" font-size="12">Ramp-up period (seconds):</text>
  <text x="620" y="270" fill="#FFFFFF" font-size="12" font-weight="700">120</text>
  <text x="432" y="296" fill="#A3A3A3" font-size="12">Loop Count:</text>
  <text x="620" y="296" fill="#FFFFFF" font-size="12" font-weight="700">Forever (stop after 10 min)</text>
  <text x="432" y="322" fill="#A3A3A3" font-size="12">Same user on each iteration:</text>
  <text x="620" y="322" fill="#FFFFFF" font-size="12">unchecked</text>
  <text x="432" y="352" fill="#71717A" font-size="11">Plain words: 200 users join over 2 minutes, then keep clicking for 10 minutes.</text>

  <rect x="416" y="386" width="728" height="100" rx="10" fill="#1E1633" stroke="#5B29DA"/>
  <text x="432" y="412" fill="#B39CFF" font-size="12" font-weight="700">Host (HTTP defaults)</text>
  <text x="432" y="438" fill="#D4D4D4" font-size="12">Protocol: https | Server: staging.example.com | Port: 443</text>
  <text x="432" y="462" fill="#71717A" font-size="11">All samplers in this group hit the staging host - never production without approval.</text>

  <rect x="416" y="500" width="728" height="80" rx="10" fill="#0F0F0F" stroke="#2A2A2A"/>
  <text x="432" y="526" fill="#75C32C" font-size="12" font-weight="700">Run controls</text>
  <rect x="432" y="538" width="80" height="28" rx="6" fill="#75C32C"/>
  <text x="472" y="556" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700">Start</text>
  <rect x="524" y="538" width="80" height="28" rx="6" fill="#2A2A2A"/>
  <text x="564" y="556" text-anchor="middle" fill="#A3A3A3" font-size="11">Stop</text>
  <text x="624" y="556" fill="#71717A" font-size="11">Status: Ready - 0 active threads</text>
</svg>
