<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Anonymized Locust web UI mock</title>
  <desc id="desc">Illustrative mock of the Locust load test control page showing user count, spawn rate, live RPS, and failure percentage during a staging run.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#bg1)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="23.5" fill="none" stroke="#2A2A2A"/>

  <circle cx="34" cy="34" r="6" fill="#F87171"/>
  <circle cx="56" cy="34" r="6" fill="#FBBF24"/>
  <circle cx="78" cy="34" r="6" fill="#75C32C"/>
  <rect x="1096" y="24" width="80" height="24" rx="12" fill="#1E1633" stroke="#5B29DA"/>
  <text x="1136" y="40" text-anchor="middle" fill="#B39CFF" font-size="11" font-weight="700">SAMPLE</text>

  <text x="40" y="76" fill="#FFFFFF" font-size="21" font-weight="700">Locust - Web UI (Control Panel)</text>
  <text x="40" y="100" fill="#A3A3A3" font-size="13">localhost:8089 - staging load test in progress - anonymized data</text>

  <!-- Top nav -->
  <rect x="40" y="118" width="1120" height="36" rx="8" fill="#141414" stroke="#2A2A2A"/>
  <text x="60" y="141" fill="#75C32C" font-size="13" font-weight="700">Locust</text>
  <text x="130" y="141" fill="#FFFFFF" font-size="12">Statistics</text>
  <text x="220" y="141" fill="#71717A" font-size="12">Charts</text>
  <text x="290" y="141" fill="#71717A" font-size="12">Failures</text>
  <text x="370" y="141" fill="#71717A" font-size="12">Exceptions</text>
  <text x="460" y="141" fill="#71717A" font-size="12">Download Data</text>
  <rect x="1040" y="126" width="100" height="22" rx="11" fill="#75C32C"/>
  <text x="1090" y="141" text-anchor="middle" fill="#0A0A0A" font-size="11" font-weight="700">RUNNING</text>

  <!-- Control panel -->
  <rect x="40" y="170" width="520" height="200" rx="12" fill="#141414" stroke="#2A2A2A"/>
  <text x="56" y="198" fill="#FFFFFF" font-size="14" font-weight="700">Start new load test</text>
  <text x="56" y="222" fill="#71717A" font-size="11">Host: https://staging.example.com</text>

  <text x="56" y="252" fill="#A3A3A3" font-size="11">Number of users (peak)</text>
  <rect x="56" y="260" width="120" height="28" rx="6" fill="#0F0F0F" stroke="#5B29DA"/>
  <text x="116" y="279" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">200</text>

  <text x="220" y="252" fill="#A3A3A3" font-size="11">Spawn rate (users/sec)</text>
  <rect x="220" y="260" width="120" height="28" rx="6" fill="#0F0F0F" stroke="#2A2A2A"/>
  <text x="280" y="279" text-anchor="middle" fill="#FFFFFF" font-size="13">10</text>

  <rect x="56" y="306" width="90" height="32" rx="8" fill="#1E1633" stroke="#5B29DA"/>
  <text x="101" y="327" text-anchor="middle" fill="#B39CFF" font-size="12" font-weight="700">Stop</text>
  <rect x="158" y="306" width="120" height="32" rx="8" fill="#2A2A2A"/>
  <text x="218" y="327" text-anchor="middle" fill="#71717A" font-size="12">Reset stats</text>

  <text x="56" y="358" fill="#A3A3A3" font-size="11">State: spawning - 142 of 200 users active</text>
  <rect x="56" y="366" width="488" height="8" rx="4" fill="#0F0F0F"/>
  <rect x="56" y="366" width="346" height="8" rx="4" fill="#5B29DA"/>

  <!-- Live stats -->
  <rect x="580" y="170" width="580" height="200" rx="12" fill="#141414" stroke="#2A2A2A"/>
  <text x="596" y="198" fill="#FFFFFF" font-size="14" font-weight="700">Live stats</text>

  <rect x="596" y="214" width="160" height="64" rx="10" fill="#0F0F0F" stroke="#2A2A2A"/>
  <text x="612" y="236" fill="#71717A" font-size="10">RPS (now)</text>
  <text x="612" y="262" fill="#75C32C" font-size="22" font-weight="700">138.2</text>

  <rect x="772" y="214" width="160" height="64" rx="10" fill="#0F0F0F" stroke="#2A2A2A"/>
  <text x="788" y="236" fill="#71717A" font-size="10">Failures</text>
  <text x="788" y="262" fill="#F87171" font-size="22" font-weight="700">1.8%</text>

  <rect x="948" y="214" width="196" height="64" rx="10" fill="#0F0F0F" stroke="#2A2A2A"/>
  <text x="964" y="236" fill="#71717A" font-size="10">Avg response (ms)</text>
  <text x="964" y="262" fill="#FFFFFF" font-size="22" font-weight="700">284</text>

  <rect x="596" y="292" width="548" height="64" rx="10" fill="#1E1633" stroke="#5B29DA"/>
  <text x="612" y="316" fill="#B39CFF" font-size="11" font-weight="700">Tip for QA</text>
  <text x="612" y="338" fill="#D4D4D4" font-size="12">Ramp up slowly. Watch fail % and p95 - stop when errors climb.</text>

  <!-- Mini chart -->
  <rect x="40" y="388" width="1120" height="200" rx="12" fill="#141414" stroke="#2A2A2A"/>
  <text x="56" y="416" fill="#A3A3A3" font-size="12" font-weight="700">Total requests per second (live chart)</text>
  <line x1="56" y1="560" x2="1140" y2="560" stroke="#2A2A2A" stroke-width="1"/>
  <line x1="56" y1="500" x2="1140" y2="500" stroke="#2A2A2A" stroke-width="1" stroke-dasharray="4"/>
  <line x1="56" y1="440" x2="1140" y2="440" stroke="#2A2A2A" stroke-width="1" stroke-dasharray="4"/>
  <polyline points="56,540 120,520 200,510 280,500 360,495 440,490 520,485 600,480 680,478 760,475 840,472 920,468 1000,465 1080,462 1140,458" fill="none" stroke="#75C32C" stroke-width="2.5"/>
  <text x="56" y="580" fill="#71717A" font-size="10">Green line = requests per second over time (sample data)</text>
</svg>
