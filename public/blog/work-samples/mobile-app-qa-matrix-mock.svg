<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Anonymized mobile app QA device matrix</title>
  <desc id="desc2">Illustrative mock showing a cross-device mobile QA matrix and a release-readiness checklist card.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg2)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" fill="none" stroke="#2A2A2A"/>

  <text x="40" y="48" fill="#FFFFFF" font-size="20" font-weight="700">Mobile App QA — Device &amp; Release Matrix (Anonymized Demo)</text>
  <text x="40" y="72" fill="#A3A3A3" font-size="13">Representative iOS / Android coverage plus a sample release-readiness checklist</text>

  <!-- Device silhouettes -->
  <g>
    <!-- small phone -->
    <rect x="60" y="120" width="90" height="180" rx="16" fill="url(#screen)" stroke="#2A2A2A" stroke-width="2"/>
    <rect x="70" y="140" width="70" height="130" rx="4" fill="#171717"/>
    <circle cx="105" cy="285" r="5" fill="#2A2A2A"/>
    <text x="105" y="320" text-anchor="middle" fill="#E5E5E5" font-size="12" font-weight="700">Compact</text>
    <text x="105" y="336" text-anchor="middle" fill="#A3A3A3" font-size="10">iPhone SE-class</text>
    <rect x="72" y="152" width="54" height="18" rx="9" fill="#0F1F12"/>
    <text x="99" y="165" text-anchor="middle" fill="#9AE070" font-size="9" font-weight="700">PASS</text>

    <!-- standard phone -->
    <rect x="185" y="105" width="100" height="200" rx="18" fill="url(#screen)" stroke="#5B29DA" stroke-width="2"/>
    <rect x="196" y="126" width="78" height="150" rx="4" fill="#171717"/>
    <circle cx="235" cy="292" r="5" fill="#2A2A2A"/>
    <text x="235" y="325" text-anchor="middle" fill="#E5E5E5" font-size="12" font-weight="700">Standard</text>
    <text x="235" y="341" text-anchor="middle" fill="#A3A3A3" font-size="10">iOS 18 · Android 14</text>
    <rect x="200" y="138" width="70" height="18" rx="9" fill="#1E1633"/>
    <text x="235" y="151" text-anchor="middle" fill="#B39CFF" font-size="9" font-weight="700">IN TEST</text>

    <!-- large phone -->
    <rect x="325" y="95" width="105" height="215" rx="20" fill="url(#screen)" stroke="#2A2A2A" stroke-width="2"/>
    <rect x="337" y="118" width="81" height="160" rx="4" fill="#171717"/>
    <circle cx="377" cy="298" r="5" fill="#2A2A2A"/>
    <text x="377" y="332" text-anchor="middle" fill="#E5E5E5" font-size="12" font-weight="700">Pro Max</text>
    <text x="377" y="348" text-anchor="middle" fill="#A3A3A3" font-size="10">Large-screen class</text>
    <rect x="341" y="130" width="72" height="18" rx="9" fill="#0F1F12"/>
    <text x="377" y="143" text-anchor="middle" fill="#9AE070" font-size="9" font-weight="700">PASS</text>

    <!-- tablet -->
    <rect x="470" y="130" width="160" height="120" rx="14" fill="url(#screen)" stroke="#2A2A2A" stroke-width="2"/>
    <rect x="482" y="142" width="136" height="96" rx="4" fill="#171717"/>
    <text x="550" y="272" text-anchor="middle" fill="#E5E5E5" font-size="12" font-weight="700">Tablet</text>
    <text x="550" y="288" text-anchor="middle" fill="#A3A3A3" font-size="10">iPad · Android tablet</text>
    <rect x="486" y="150" width="72" height="18" rx="9" fill="#3A2A0E"/>
    <text x="522" y="163" text-anchor="middle" fill="#FDE68A" font-size="9" font-weight="700">RETEST</text>
  </g>

  <!-- Divider -->
  <rect x="670" y="110" width="1" height="220" fill="#2A2A2A"/>

  <!-- Checklist card -->
  <g>
    <rect x="700" y="105" width="460" height="230" rx="14" fill="#141414" stroke="#2A2A2A"/>
    <text x="724" y="134" fill="#FFFFFF" font-size="14" font-weight="700">Release Readiness Checklist</text>
    <text x="724" y="153" fill="#A3A3A3" font-size="11">Build 1.8.2 · TestFlight + Internal APK track</text>

    <g font-size="12.5" fill="#E5E5E5">
      <circle cx="730" cy="175" r="8" fill="#75C32C"/>
      <path d="M726 175 l3 3 l6 -7" stroke="#0A0A0A" stroke-width="1.6" fill="none"/>
      <text x="748" y="180">Cold launch, no crash on target OS versions</text>

      <circle cx="730" cy="200" r="8" fill="#75C32C"/>
      <path d="M726 200 l3 3 l6 -7" stroke="#0A0A0A" stroke-width="1.6" fill="none"/>
      <text x="748" y="205">Camera / notification permission deny paths</text>

      <circle cx="730" cy="225" r="8" fill="#75C32C"/>
      <path d="M726 225 l3 3 l6 -7" stroke="#0A0A0A" stroke-width="1.6" fill="none"/>
      <text x="748" y="230">Background → foreground resume, no state loss</text>

      <circle cx="730" cy="250" r="8" fill="#3A2A0E" stroke="#FDE68A"/>
      <text x="748" y="255">Offline → online balance recovery — retest</text>

      <circle cx="730" cy="275" r="8" fill="#75C32C"/>
      <path d="M726 275 l3 3 l6 -7" stroke="#0A0A0A" stroke-width="1.6" fill="none"/>
      <text x="748" y="280">Push notification deep link opens correct screen</text>

      <circle cx="730" cy="300" r="8" fill="#75C32C"/>
      <path d="M726 300 l3 3 l6 -7" stroke="#0A0A0A" stroke-width="1.6" fill="none"/>
      <text x="748" y="305">30–60 min soak test — zero blocker crashes</text>
    </g>
  </g>

  <!-- Bottom summary strip -->
  <rect x="40" y="390" width="1120" height="1" fill="#2A2A2A"/>
  <g font-size="13" fill="#E5E5E5">
    <text x="40" y="424" font-weight="700" fill="#FFFFFF">Sample device / OS pass rate</text>
    <rect x="40" y="440" width="1120" height="26" rx="13" fill="#1A1A1A"/>
    <rect x="40" y="440" width="980" height="26" rx="13" fill="#75C32C"/>
    <text x="1050" y="458" text-anchor="end" fill="#0A0A0A" font-size="12" font-weight="700">21 / 24 checks passed</text>
  </g>

  <g font-size="12" fill="#A3A3A3">
    <text x="40" y="500">Critical: 0 open</text>
    <text x="220" y="500">High: 1 open (retest)</text>
    <text x="420" y="500">Medium: 2 open</text>
    <text x="620" y="500">Smoke pack: green</text>
    <text x="840" y="500">Decision: Go, with waiver</text>
  </g>

  <text x="40" y="600" fill="#71717A" font-size="12">Illustrative matrix — figures and checklist items are representative samples, not a live client dashboard</text>
  <text x="1160" y="600" text-anchor="end" fill="#7C4DFF" font-size="12" font-weight="700">masfiqur.com</text>
</svg>
