<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="gatitle gadesc">
  <title id="gatitle">Anonymized Google Analytics 4 DebugView mock</title>
  <desc id="gadesc">Illustrative mock of a GA4 DebugView session validating page_view, sign_up, and purchase events with parameters.</desc>
  <defs>
    <linearGradient id="gabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#gabg)"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="23.5" fill="none" stroke="#2A2A2A"/>

  <circle cx="34" cy="34" r="6" fill="#F87171"/>
  <circle cx="56" cy="34" r="6" fill="#FBBF24"/>
  <circle cx="78" cy="34" r="6" fill="#75C32C"/>
  <rect x="110" y="22" width="420" height="24" rx="12" fill="#171717" stroke="#2A2A2A"/>
  <text x="128" y="38" fill="#A3A3A3" font-size="11">analytics.google.com/analytics/web/#/debugview</text>

  <text x="600" y="76" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">GA4 DebugView — Realtime Event Validation (Anonymized Demo)</text>
  <text x="600" y="100" text-anchor="middle" fill="#A3A3A3" font-size="13">Sample event QA for page_view, sign_up &amp; purchase — no real user or client data</text>

  <!-- Left: device stream -->
  <g>
    <rect x="40" y="126" width="220" height="400" rx="10" fill="#141414" stroke="#2A2A2A"/>
    <text x="60" y="154" fill="#FFFFFF" font-size="12.5" font-weight="700">Debug devices</text>
    <rect x="56" y="170" width="188" height="46" rx="8" fill="#1E1633" stroke="#5B29DA"/>
    <circle cx="76" cy="193" r="5" fill="#75C32C"/>
    <text x="90" y="190" fill="#F3F0FF" font-size="11" font-weight="700">Sample Test Device</text>
    <text x="90" y="205" fill="#B9B2D6" font-size="9.5">Pixel-sample · Chrome</text>
    <rect x="56" y="224" width="188" height="40" rx="8" fill="#171717" stroke="#2A2A2A"/>
    <text x="90" y="248" fill="#A3A3A3" font-size="10.5">No other active devices</text>
  </g>

  <!-- Center: timeline -->
  <g>
    <rect x="280" y="126" width="480" height="400" rx="10" fill="#141414" stroke="#2A2A2A"/>
    <text x="300" y="154" fill="#FFFFFF" font-size="12.5" font-weight="700">Event stream (last 30 sample events)</text>

    <rect x="300" y="172" width="1" height="330" fill="#2A2A2A"/>
    <g font-size="11.5">
      <circle cx="300" cy="196" r="6" fill="#75C32C"/>
      <text x="316" y="200" fill="#E5E5E5">page_view</text>
      <text x="620" y="200" fill="#71717A" text-anchor="end">12:04:02</text>

      <circle cx="300" cy="232" r="6" fill="#75C32C"/>
      <text x="316" y="236" fill="#E5E5E5">session_start</text>
      <text x="620" y="236" fill="#71717A" text-anchor="end">12:04:02</text>

      <circle cx="300" cy="268" r="6" fill="#75C32C"/>
      <text x="316" y="272" fill="#E5E5E5">sign_up</text>
      <text x="620" y="272" fill="#71717A" text-anchor="end">12:05:41</text>

      <circle cx="300" cy="304" r="6" fill="#75C32C"/>
      <text x="316" y="308" fill="#E5E5E5">view_item</text>
      <text x="620" y="308" fill="#71717A" text-anchor="end">12:07:15</text>

      <circle cx="300" cy="340" r="6" fill="#75C32C"/>
      <text x="316" y="344" fill="#E5E5E5">add_to_cart</text>
      <text x="620" y="344" fill="#71717A" text-anchor="end">12:07:52</text>

      <circle cx="300" cy="376" r="7.5" fill="#5B29DA"/>
      <rect x="308" y="364" width="300" height="26" rx="6" fill="#1E1633" stroke="#5B29DA"/>
      <text x="320" y="382" fill="#FFFFFF" font-weight="700">purchase</text>
      <text x="596" y="382" fill="#B39CFF" text-anchor="end">12:08:30 · selected</text>

      <circle cx="300" cy="412" r="6" fill="#75C32C"/>
      <text x="316" y="416" fill="#E5E5E5">first_visit</text>
      <text x="620" y="416" fill="#71717A" text-anchor="end">12:08:31</text>
    </g>
  </g>

  <!-- Right: params panel -->
  <g>
    <rect x="780" y="126" width="380" height="400" rx="10" fill="#141414" stroke="#2A2A2A"/>
    <text x="800" y="154" fill="#FFFFFF" font-size="13" font-weight="700">purchase</text>
    <rect x="1000" y="138" width="140" height="22" rx="11" fill="#0F1F12"/>
    <text x="1070" y="153" text-anchor="middle" fill="#9AE070" font-size="10" font-weight="700">– VALIDATED</text>

    <text x="800" y="180" fill="#A3A3A3" font-size="11" font-weight="700">Event parameters</text>

    <g font-size="11" fill="#E5E5E5">
      <rect x="800" y="192" width="340" height="28" fill="#171717"/>
      <text x="812" y="211">currency</text>
      <text x="1128" y="211" text-anchor="end" fill="#9AE070">USD</text>

      <rect x="800" y="220" width="340" height="28" fill="#141414"/>
      <text x="812" y="239">value</text>
      <text x="1128" y="239" text-anchor="end" fill="#9AE070">49.99</text>

      <rect x="800" y="248" width="340" height="28" fill="#171717"/>
      <text x="812" y="267">transaction_id</text>
      <text x="1128" y="267" text-anchor="end" fill="#9AE070">T-sample-1029</text>

      <rect x="800" y="276" width="340" height="28" fill="#141414"/>
      <text x="812" y="295">items</text>
      <text x="1128" y="295" text-anchor="end" fill="#9AE070">1</text>

      <rect x="800" y="304" width="340" height="28" fill="#171717"/>
      <text x="812" y="323">payment_type</text>
      <text x="1128" y="323" text-anchor="end" fill="#9AE070">card (sample)</text>
    </g>

    <rect x="800" y="344" width="340" height="1" fill="#2A2A2A"/>
    <text x="800" y="366" fill="#A3A3A3" font-size="11" font-weight="700">QA validation checklist</text>
    <g font-size="10.5" fill="#E5E5E5">
      <circle cx="808" cy="382" r="6" fill="#75C32C"/>
      <path d="M805 382 l2 2 l4 -5" stroke="#0A0A0A" stroke-width="1.3" fill="none"/>
      <text x="822" y="386">page_view fires once per screen</text>

      <circle cx="808" cy="402" r="6" fill="#75C32C"/>
      <path d="M805 402 l2 2 l4 -5" stroke="#0A0A0A" stroke-width="1.3" fill="none"/>
      <text x="822" y="406">sign_up fires only after success</text>

      <circle cx="808" cy="422" r="6" fill="#75C32C"/>
      <path d="M805 422 l2 2 l4 -5" stroke="#0A0A0A" stroke-width="1.3" fill="none"/>
      <text x="822" y="426">purchase value matches order total</text>

      <circle cx="808" cy="442" r="6" fill="#75C32C"/>
      <path d="M805 442 l2 2 l4 -5" stroke="#0A0A0A" stroke-width="1.3" fill="none"/>
      <text x="822" y="446">no duplicate purchase on refresh</text>
    </g>
  </g>

  <text x="40" y="565" fill="#71717A" font-size="12">Illustrative DebugView layout — device, event timing &amp; parameter values are anonymized samples, not a live property</text>
  <text x="1160" y="565" text-anchor="end" fill="#7C4DFF" font-size="12" font-weight="700">masfiqur.com</text>
</svg>
