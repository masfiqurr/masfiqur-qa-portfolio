<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="cwtitle cwdesc">
  <title id="cwtitle">Anonymized AWS CloudWatch Logs Insights mock</title>
  <desc id="cwdesc">Illustrative mock of AWS CloudWatch showing an error-count spike chart and a Logs Insights query with sample results.</desc>
  <defs>
    <linearGradient id="cwbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#cwbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="23.5" fill="none" stroke="#2A2A2A"/>

  <circle cx="34" cy="34" r="6" fill="#F87171"/>
  <circle cx="56" cy="34" r="6" fill="#FBBF24"/>
  <circle cx="78" cy="34" r="6" fill="#75C32C"/>
  <rect x="110" y="22" width="420" height="24" rx="12" fill="#171717" stroke="#2A2A2A"/>
  <text x="128" y="38" fill="#A3A3A3" font-size="11">console.aws.amazon.com/cloudwatch/home#logsV2:logs-insights</text>

  <text x="600" y="76" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">AWS CloudWatch — Logs Insights &amp; Error Spike (Anonymized Demo)</text>
  <text x="600" y="100" text-anchor="middle" fill="#A3A3A3" font-size="13">Sample production error investigation — no real client logs or identifiers</text>

  <!-- Error spike chart -->
  <g>
    <rect x="40" y="126" width="1120" height="180" rx="12" fill="#141414" stroke="#2A2A2A"/>
    <text x="60" y="152" fill="#FFFFFF" font-size="12.5" font-weight="700">ERROR count — api-gateway-sample (last 3 hours)</text>

    <!-- axis -->
    <rect x="60" y="260" width="1080" height="1" fill="#2A2A2A"/>
    <!-- bars -->
    <g fill="#5B29DA">
      <rect x="72" y="248" width="24" height="12"/>
      <rect x="108" y="244" width="24" height="16"/>
      <rect x="144" y="250" width="24" height="10"/>
      <rect x="180" y="246" width="24" height="14"/>
      <rect x="216" y="252" width="24" height="8"/>
      <rect x="252" y="248" width="24" height="12"/>
      <rect x="288" y="244" width="24" height="16"/>
    </g>
    <g fill="#F87171">
      <rect x="324" y="150" width="24" height="110"/>
      <rect x="360" y="140" width="24" height="120"/>
      <rect x="396" y="130" width="24" height="130"/>
      <rect x="432" y="148" width="24" height="112"/>
    </g>
    <g fill="#5B29DA">
      <rect x="468" y="246" width="24" height="14"/>
      <rect x="504" y="250" width="24" height="10"/>
      <rect x="540" y="248" width="24" height="12"/>
      <rect x="576" y="244" width="24" height="16"/>
      <rect x="612" y="250" width="24" height="10"/>
      <rect x="648" y="246" width="24" height="14"/>
      <rect x="684" y="248" width="24" height="12"/>
      <rect x="720" y="252" width="24" height="8"/>
      <rect x="756" y="246" width="24" height="14"/>
      <rect x="792" y="250" width="24" height="10"/>
      <rect x="828" y="248" width="24" height="12"/>
      <rect x="864" y="244" width="24" height="16"/>
      <rect x="900" y="250" width="24" height="10"/>
      <rect x="936" y="246" width="24" height="14"/>
      <rect x="972" y="248" width="24" height="12"/>
      <rect x="1008" y="252" width="24" height="8"/>
      <rect x="1044" y="246" width="24" height="14"/>
      <rect x="1080" y="250" width="24" height="10"/>
    </g>

    <rect x="316" y="128" width="150" height="24" rx="6" fill="#2A1414" stroke="#7F1D1D"/>
    <text x="391" y="144" text-anchor="middle" fill="#FCA5A5" font-size="10.5" font-weight="700">Spike: 04:12–04:27 UTC</text>

    <text x="60" y="278" fill="#71717A" font-size="10">03:00</text>
    <text x="560" y="278" fill="#71717A" font-size="10" text-anchor="middle">04:30</text>
    <text x="1128" y="278" fill="#71717A" font-size="10" text-anchor="end">06:00</text>
  </g>

  <!-- Logs Insights query -->
  <g>
    <rect x="40" y="320" width="1120" height="70" rx="10" fill="#0F0F0F" stroke="#2A2A2A"/>
    <text x="60" y="344" fill="#A3A3A3" font-size="10.5">Logs Insights query</text>
    <text x="60" y="366" fill="#B39CFF" font-size="12" font-family="monospace">fields @timestamp, @message | filter @message like /ERROR/ | sort @timestamp desc | limit 20</text>
    <rect x="1010" y="332" width="130" height="26" rx="6" fill="#5B29DA"/>
    <text x="1075" y="349" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">▶ Run query</text>
  </g>

  <!-- Results table -->
  <g>
    <text x="40" y="416" fill="#FFFFFF" font-size="12.5" font-weight="700">Results (sample) — 342 records scanned, 20 shown</text>

    <g font-size="10.8" font-family="monospace">
      <rect x="40" y="428" width="1120" height="24" fill="#171717"/>
      <text x="56" y="444" fill="#A3A3A3">@timestamp</text>
      <text x="260" y="444" fill="#A3A3A3">@message</text>

      <rect x="40" y="452" width="1120" height="26" fill="#2A1414" stroke="#7F1D1D"/>
      <text x="56" y="470" fill="#FCA5A5">2026-07-21T04:14:02.331Z</text>
      <text x="260" y="470" fill="#FCA5A5">ERROR 502 upstream connect error — service: payments-sample, retries: 3</text>

      <rect x="40" y="478" width="1120" height="26" fill="#141414"/>
      <text x="56" y="496" fill="#D4D4D4">2026-07-21T04:14:57.882Z</text>
      <text x="260" y="496" fill="#D4D4D4">ERROR timeout waiting for downstream response after 5000ms — route: /v1/checkout</text>

      <rect x="40" y="504" width="1120" height="26" fill="#2A1414" stroke="#7F1D1D"/>
      <text x="56" y="522" fill="#FCA5A5">2026-07-21T04:15:12.004Z</text>
      <text x="260" y="522" fill="#FCA5A5">ERROR 502 upstream connect error — service: payments-sample, retries: 3</text>

      <rect x="40" y="530" width="1120" height="26" fill="#141414"/>
      <text x="56" y="548" fill="#D4D4D4">2026-07-21T04:22:40.119Z</text>
      <text x="260" y="548" fill="#D4D4D4">ERROR connection pool exhausted — db-sample-cluster, active: 100/100</text>

      <rect x="40" y="556" width="1120" height="26" fill="#0F1F12" stroke="#2E5D1B"/>
      <text x="56" y="574" fill="#9AE070">2026-07-21T04:29:03.552Z</text>
      <text x="260" y="574" fill="#9AE070">INFO recovered — auto-scaling added 2 tasks, error rate back to baseline</text>
    </g>
  </g>

  <text x="40" y="620" fill="#71717A" font-size="12">Illustrative CloudWatch layout — service names, timestamps &amp; log lines are anonymized samples, not a real production account</text>
  <text x="1160" y="620" text-anchor="end" fill="#7C4DFF" font-size="12" font-weight="700">masfiqur.com</text>
</svg>
