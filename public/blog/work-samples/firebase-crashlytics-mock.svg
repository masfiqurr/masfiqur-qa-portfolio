<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Manrope, Arial, sans-serif" role="img" aria-labelledby="fbtitle fbdesc">
  <title id="fbtitle">Anonymized Firebase Crashlytics console mock</title>
  <desc id="fbdesc">Illustrative mock of a Firebase Crashlytics dashboard showing crash-free users trend and top fatal/non-fatal issues.</desc>
  <defs>
    <linearGradient id="fbbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#fbbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="23.5" fill="none" stroke="#2A2A2A"/>

  <circle cx="34" cy="34" r="6" fill="#F87171"/>
  <circle cx="56" cy="34" r="6" fill="#FBBF24"/>
  <circle cx="78" cy="34" r="6" fill="#75C32C"/>
  <rect x="110" y="22" width="420" height="24" rx="12" fill="#171717" stroke="#2A2A2A"/>
  <text x="128" y="38" fill="#A3A3A3" font-size="11">console.firebase.google.com/project/sample-app/crashlytics</text>

  <text x="600" y="76" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Firebase Crashlytics — Stability Overview (Anonymized Demo)</text>
  <text x="600" y="100" text-anchor="middle" fill="#A3A3A3" font-size="13">Sample crash-free trend and top issues from a mobile release candidate</text>

  <!-- Top metric cards -->
  <g>
    <rect x="40" y="126" width="270" height="110" rx="12" fill="#141414" stroke="#2A2A2A"/>
    <text x="60" y="152" fill="#A3A3A3" font-size="11">Crash-free users</text>
    <text x="60" y="196" fill="#9AE070" font-size="34" font-weight="700">99.4%</text>
    <text x="60" y="218" fill="#75C32C" font-size="11">▲ 0.3% vs previous build</text>

    <rect x="330" y="126" width="270" height="110" rx="12" fill="#141414" stroke="#2A2A2A"/>
    <text x="350" y="152" fill="#A3A3A3" font-size="11">Crash-free sessions</text>
    <text x="350" y="196" fill="#9AE070" font-size="34" font-weight="700">99.7%</text>
    <text x="350" y="218" fill="#75C32C" font-size="11">▲ stable across builds</text>

    <rect x="620" y="126" width="270" height="110" rx="12" fill="#141414" stroke="#2A2A2A"/>
    <text x="640" y="152" fill="#A3A3A3" font-size="11">Open issues (sample)</text>
    <text x="640" y="196" fill="#FDE68A" font-size="34" font-weight="700">6</text>
    <text x="640" y="218" fill="#A3A3A3" font-size="11">2 fatal · 4 non-fatal</text>

    <rect x="910" y="126" width="250" height="110" rx="12" fill="#141414" stroke="#2A2A2A"/>
    <text x="930" y="152" fill="#A3A3A3" font-size="11">Affected users (sample)</text>
    <text x="930" y="196" fill="#F87171" font-size="34" font-weight="700">18</text>
    <text x="930" y="218" fill="#A3A3A3" font-size="11">Build 1.8.2 · last 7 days</text>
  </g>

  <!-- Trend chart -->
  <g>
    <rect x="40" y="252" width="1120" height="140" rx="12" fill="#141414" stroke="#2A2A2A"/>
    <text x="60" y="278" fill="#FFFFFF" font-size="12.5" font-weight="700">Crash-free users — last 14 sample builds</text>
    <polyline points="70,360 150,352 230,356 310,340 390,344 470,330 550,335 630,320 710,326 790,312 870,318 950,306 1030,310 1110,300" fill="none" stroke="#75C32C" stroke-width="3"/>
    <circle cx="1110" cy="300" r="5" fill="#75C32C"/>
    <text x="1110" y="290" text-anchor="end" fill="#9AE070" font-size="10" font-weight="700">99.4%</text>
    <rect x="40" y="392" width="1120" height="1" fill="#2A2A2A"/>
  </g>

  <!-- Issues table -->
  <g>
    <text x="40" y="424" fill="#FFFFFF" font-size="13" font-weight="700">Top issues (sample data)</text>

    <g font-size="11" font-weight="700" fill="#A3A3A3">
      <text x="60" y="450">Issue</text>
      <text x="700" y="450">Events</text>
      <text x="800" y="450">Users</text>
      <text x="900" y="450">Type</text>
      <text x="1000" y="450">Status</text>
    </g>

    <g font-size="11.5" fill="#E5E5E5">
      <rect x="40" y="460" width="1120" height="34" fill="#171226" stroke="#5B29DA"/>
      <text x="60" y="482" fill="#F3F0FF">Fatal Exception: NSInvalidArgumentException in CheckoutViewController</text>
      <text x="700" y="482" fill="#F3F0FF">12</text>
      <text x="800" y="482" fill="#F3F0FF">9</text>
      <text x="900" y="482" fill="#FCA5A5">Fatal</text>
      <text x="1000" y="482" fill="#B39CFF">Investigating</text>

      <rect x="40" y="494" width="1120" height="34" fill="#141414"/>
      <text x="60" y="516">NetworkOnMainThreadException during background sync</text>
      <text x="700" y="516">5</text>
      <text x="800" y="516">5</text>
      <text x="900" y="516" fill="#FDE68A">Non-fatal</text>
      <text x="1000" y="516" fill="#A3A3A3">Open</text>

      <rect x="40" y="528" width="1120" height="34" fill="#171717"/>
      <text x="60" y="550">Fatal Exception: EXC_BAD_ACCESS in ImageCacheManager</text>
      <text x="700" y="550">4</text>
      <text x="800" y="550">4</text>
      <text x="900" y="550" fill="#FCA5A5">Fatal</text>
      <text x="1000" y="550" fill="#A3A3A3">Open</text>

      <rect x="40" y="562" width="1120" height="34" fill="#0F1F12" stroke="#2E5D1B"/>
      <text x="60" y="584" fill="#D9F2C7">IllegalStateException on rotated form re-submit (fixed)</text>
      <text x="700" y="584" fill="#D9F2C7">3</text>
      <text x="800" y="584" fill="#D9F2C7">3</text>
      <text x="900" y="584" fill="#9AE070">Non-fatal</text>
      <text x="1000" y="584" fill="#9AE070">Resolved</text>
    </g>
  </g>

  <text x="40" y="640" fill="#71717A" font-size="12">Illustrative Crashlytics layout — issue titles, counts &amp; trend values are anonymized samples, not a live client console</text>
  <text x="1160" y="640" text-anchor="end" fill="#7C4DFF" font-size="12" font-weight="700">masfiqur.com</text>
</svg>
